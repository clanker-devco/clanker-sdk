name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TESTS_RPC_URL: ${{ secrets.TESTS_RPC_URL }}
  TESTS_RPC_URL_SEPOLIA: ${{ secrets.TESTS_RPC_URL_SEPOLIA }}
  TESTS_RPC_URL_MAINNET: ${{ secrets.TESTS_RPC_URL_MAINNET }}
  TESTS_RPC_URL_BASE: ${{ secrets.TESTS_RPC_URL_BASE }}
  TESTS_RPC_URL_ARBITRUM: ${{ secrets.TESTS_RPC_URL_ARBITRUM }}
  TESTS_RPC_URL_UNICHAIN: ${{ secrets.TESTS_RPC_URL_UNICHAIN }}
  TESTS_RPC_URL_MONAD: ${{ secrets.TESTS_RPC_URL_MONAD }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
