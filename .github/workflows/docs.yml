name: Generate SDK Docs

on:
  # Publish reference docs for the version that ships to npm, not for every merge.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      check_access_only:
        description: Verify DOCS credentials without publishing documentation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCS_BRANCH: ${{ vars.DOCS_BRANCH || 'main' }}
    steps:
      - name: Check DOCS publishing access
        env:
          GH_TOKEN: ${{ secrets.DOCS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set DOCS_PAT to a credential with Contents read/write access to clanker-devco/DOCS."
            exit 1
          fi
          if [ "$(gh api repos/clanker-devco/DOCS --jq '.permissions.push')" != "true" ]; then
            echo "::error::DOCS_PAT must belong to an account allowed to push to clanker-devco/DOCS."
            exit 1
          fi

      - name: Verify DOCS Git access without publishing
        if: ${{ inputs.check_access_only }}
        env:
          GH_TOKEN: ${{ secrets.DOCS_PAT }}
        run: |
          git check-ref-format --branch "$DOCS_BRANCH" > /dev/null
          gh auth setup-git
          verify_dir=$(mktemp -d)
          git -C "$verify_dir" init --quiet
          git -C "$verify_dir" remote add origin https://github.com/clanker-devco/DOCS.git
          git -C "$verify_dir" fetch --quiet --depth=1 origin "refs/heads/$DOCS_BRANCH"
          git -C "$verify_dir" push --dry-run origin "FETCH_HEAD:refs/heads/$DOCS_BRANCH"
          echo "DOCS credential and Git access checks passed. No documentation was published."

      - name: Checkout clanker-sdk
        if: ${{ inputs.check_access_only != true }}
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ inputs.check_access_only != true }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: ${{ inputs.check_access_only != true }}
        run: bun i

      - name: Generate SDK docs
        if: ${{ inputs.check_access_only != true }}
        run: bun typedoc

      - name: Checkout DOCS repo
        if: ${{ inputs.check_access_only != true }}
        uses: actions/checkout@v4
        with:
          repository: clanker-devco/DOCS
          ref: ${{ env.DOCS_BRANCH }}
          token: ${{ secrets.DOCS_PAT }}
          path: DOCS

      - name: Setup Node for Mintlify conversion
        if: ${{ inputs.check_access_only != true && hashFiles('DOCS/mintlify/scripts/import-generated.mjs') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update documentation
        if: ${{ inputs.check_access_only != true }}
        run: |
          rm -rf DOCS/sdk-reference/index.md DOCS/sdk-reference/v3.md DOCS/sdk-reference/v4.md DOCS/sdk-reference/v4/ DOCS/sdk-reference/legacyFeeClaims.md
          cp docs/generated/index.md DOCS/sdk-reference/index.md
          cp docs/generated/v3.md DOCS/sdk-reference/v3.md
          cp docs/generated/v4.md DOCS/sdk-reference/v4.md
          cp -r docs/generated/v4 DOCS/sdk-reference/v4
          cp docs/generated/legacyFeeClaims.md DOCS/sdk-reference/legacyFeeClaims.md

          if [ -f DOCS/mintlify/scripts/import-generated.mjs ]; then
            npm ci --prefix DOCS/mintlify --ignore-scripts --no-audit --no-fund
            node DOCS/mintlify/scripts/import-generated.mjs sdk docs/generated
            npm run check --prefix DOCS/mintlify
          fi

      - name: Commit and push to DOCS
        if: ${{ inputs.check_access_only != true }}
        working-directory: DOCS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SDK reference docs from clanker-sdk ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
            git push
          fi
